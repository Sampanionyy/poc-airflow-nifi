global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Métriques Airflow (via StatsD Exporter)
  - job_name: "airflow-statsd"
    static_configs:
      - targets: ["statsd-exporter:9102"]

  # Métriques NiFi (nécessite PrometheusReportingTask activé dans l'UI NiFi)
  - job_name: "nifi"
    static_configs:
      - targets: ["nifi:9092"]
    metrics_path: "/metrics"
    scheme: "http"
    fallback_scrape_protocol: "PrometheusText0.0.4"
